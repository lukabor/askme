services:

# ===== Main askme RAG application ============================================
  askme:
    build: .
    container_name: askme
    volumes:
      - .:/usr/askme                              # live code reload
      - ./data:/usr/askme/data                    # notebooks, processed text, indexes
    environment:
      - PYTHONPATH=/usr/askme
      - DATA_DIR=/usr/data
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-askme_neo4j}
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - OLLAMA_HOST=http://ollama:11434
      - LLM_MODEL=${LLM_MODEL:-qwen2.5:14b}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-nomic-embed-text}
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      neo4j:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      ollama:
        condition: service_started
    restart: unless-stopped

  # ==== Neo4j – graph storage for LightRAG knowledge graph ===================
  neo4j:
    image: neo4j:5-community
    container_name: askme-neo4j
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-askme_neo4j}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_memory_heap_max__size=2G
      - NEO4J_dbms_memory_pagecache_size=1G
    ports:
      - "7474:7474"   # Neo4j Browser UI
      - "7687:7687"   # Bolt protocol
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "${NEO4J_PASSWORD:-askme_neo4j}", "RETURN 1"]
      interval: 15s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  # ==== Qdrant – vector storage for dense retrieval ==========================
  qdrant:
    image: qdrant/qdrant:latest
    container_name: askme-qdrant
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ==== Ollama – local LLM server (Qwen2.5-14B + embedding model) ============
  #  Qwen 14B model is pretty much max that you can run with 5060
  ollama:
    image: ollama/ollama:latest
    container_name: askme-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    # GPU passthrough – requires NVIDIA Container Toolkit on host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  neo4j_data:
  neo4j_logs:
  qdrant_data:
  ollama_models:
