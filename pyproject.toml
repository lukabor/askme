[project]
name = "askme"
version = "0.0.1"
description = "LightRAG-powered Q&A over provided jupyter, Rmd notebooks and other scripts"
requires-python = ">=3.12"
dependencies = [
    # lightRAG deps
    "lightrag-hku>=1.0",

    #  LLM / Embeddings
    # if not needed these will be removed
    "openai>=1.0",          # OpenAI-compatible client (used for Ollama too)
    "anthropic>=0.40",      # optional fallback

    # Vector store
    "qdrant-client>=1.12",

    # Graph store
    "neo4j>=5.0",

    # Notebook ingestion
    "nbconvert>=7.0",
    "nbformat>=5.0",

    # Deduplication (MinHash)
    "datasketch>=1.6",

    # API 
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",

    #  Utilities 
    "python-dotenv>=1.0",
    "tqdm>=4.0",
    "rich>=13.0",
    "typer>=0.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "ipykernel>=6.0",
    "jupyterlab>=4.0",
    "notebook>=7.0",
]
eval = [
    # RAG evaluation 
    "ragas>=0.2",
    "datasets>=3.0",
]

[project.scripts]
askme-ingest  = "src.ingestion.cli:main"
askme-query   = "src.api.cli:main"
askme-eval    = "src.evaluation.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 90
target-version = "py312"
preview = true
exclude = [
    ".git",
    ".jj",
    "__pycache__",
    "_bin/*",
    "_build/*",
    ".venv",
    ".mypy_cache",
    ".pytype",
    ".svn",
    "__pypackages__",
]
extend-exclude = ["*.ipynb"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "NPY",    # numpy-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["askme"]

[tool.ruff.lint.flake8-implicit-str-concat]
allow-multiline = false

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = [
    "-ra",
    "--strict-markers",
    "-q",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]

[tool.coverage.run]
source = ["askme"]
branch = true
omit = ["tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
